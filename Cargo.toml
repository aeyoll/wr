[package]
name = "wr"
version = "0.1.24"
edition = "2021"
description = "A Rust tool to deploy websites with ease, using git-flow and Gitlab CI/CD."
license = "MIT"
homepage = "https://github.com/aeyoll/wr"

[dependencies]
miette = { version = "7.6.0", features = ["fancy", "derive"] }
thiserror = "2.0.20"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12.0"
duct = "1.1.2"
git2 = { version = "0.21.0", features = ["ssh", "https"] }
gitlab = "0.1902.0"
indicatif = "0.18.6"
log = "0.4.34"
regex = "1"
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
simplelog = "0.12.2"

[dev-dependencies]
tempfile = "3.27"
httpmock = "0.8"
serial_test = "4.0"
serde_json = "1"
