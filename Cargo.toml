[package]
name = "wr"
version = "0.1.24"
edition = "2021"
description = "A Rust tool to deploy websites with ease, using git-flow and Gitlab CI/CD."
license = "MIT"
homepage = "https://github.com/aeyoll/wr"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12.0"
duct = "1.1.1"
git2 = "0.21.0"
gitlab = "0.1902.0"
indicatif = "0.18.6"
lazy_static = "1.5.0"
log = "0.4.33"
openssl = { version = "0.10", features = ["vendored"] }
regex = "1"
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
simplelog = "0.12.2"

[dev-dependencies]
tempfile = "3.27"
mockall = "0.15"
httpmock = "0.8"
serial_test = "4.0"
